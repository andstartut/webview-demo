<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo App</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #0f172a;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #2563eb; }
        p { color: #64748b; line-height: 1.5; }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Field Team Demo</h1>
        <p>This is a placeholder web application for demonstrating Android &amp; WebView interaction architecture.</p>
        <span class="badge">Status: Connected</span>
    </div>
</body>
</html>
